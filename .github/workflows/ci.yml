name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run test:eval
  self-evolution:
    # the ledger's questions are answered for every changed file, and every
    # fix names its finding — re-checked here so --no-verify does not get past.
    # Pull requests only: the range starts at the PR's own base. A push has no
    # base, and main charged a stacked branch with its parents' files (F-128);
    # a push to main was an empty range anyway.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: answers and finding rules over the branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          base="${BASE_REF:?the range check needs the pull request base}"
          git fetch -q origin "$base"
          SAKK_BRANCH="$HEAD_REF" node scripts/findings-check.mjs --range "origin/$base"
      - name: the base branch's checker judges this pull request too
        # A pull request cannot loosen the check that judges it: the base's own
        # checker scripts, read with git show, run over this branch as well.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          base="${BASE_REF:?the range check needs the pull request base}"
          if ! git cat-file -e "origin/$base:scripts/findings-check.mjs" 2>/dev/null; then
            echo "self-evolution: the base has no checker yet; only this branch's checker ran"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/base-checker/scripts"
          for f in $(git ls-tree --name-only "origin/$base" scripts/ | grep -E '^scripts/findings-[a-z-]+\.mjs$'); do
            git show "origin/$base:$f" > "$RUNNER_TEMP/base-checker/$f"
          done
          SAKK_BRANCH="$HEAD_REF" node "$RUNNER_TEMP/base-checker/scripts/findings-check.mjs" --range "origin/$base"
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm run format:check
      - run: npm run lint
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run drill
      - run: npm run fuzz
      - run: npm run fuzz:policy
      - run: npm run fuzz:l1
      - run: npm run campaigns
