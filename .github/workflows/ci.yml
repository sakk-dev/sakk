name: ci
# One run per commit (F-218): a pull request commit runs here once, on its
# pull_request event; main runs again after the merge. A branch without a
# pull request is checked by the pre-push hook only. A newer push to a pull
# request cancels its older run; a run on main has its own group (run_id) and
# is never cancelled. test/ci-cost.test.mjs holds the budget.
#
# A pull request from a fork skips only the self-evolution and base-checker
# jobs, which judge this repository's own findings-ledger answers (opt-in for
# outside contributors, CONTRIBUTING.md); tests, format, the DCO check and the
# drill run for every pull request.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run test:eval
  self-evolution:
    # the ledger's questions are answered for every changed file, and every
    # fix names its finding — re-checked here so --no-verify does not get past.
    # Pull requests only: the range starts at the PR's own base. A push has no
    # base, and main charged a stacked branch with its parents' files (F-128);
    # a push to main was an empty range anyway. Not for a fork's pull request.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: answers and finding rules over the branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          base="${BASE_REF:?the range check needs the pull request base}"
          git fetch -q origin "$base"
          SAKK_BRANCH="$HEAD_REF" node scripts/findings-check.mjs --range "origin/$base"
      - name: every fix in this branch is proven red before and green after
        # FAIL_TO_PASS (R7): a finding fixed here names a guard test that fails
        # on the base with the new test copied in, and passes on this branch.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/findings-proof.mjs --range "origin/${BASE_REF:?the proof needs the pull request base}"
  base-checker:
    # A pull request cannot loosen the check that judges it: the base's own
    # checker scripts, read with git show, run over this branch as well. This
    # is a SEPARATE job (F-158): run in the self-evolution job after the PR's
    # own checker, the PR's checker could move HEAD or write $GITHUB_ENV first
    # and leave the base checker an empty range to pass. A fresh runner has no
    # PR code run in it, so its checkout and HEAD are untampered. Not for a
    # fork's pull request.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: the base branch's checker judges this pull request too
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          base="${BASE_REF:?the range check needs the pull request base}"
          git fetch -q origin "$base"
          if ! git cat-file -e "origin/$base:scripts/findings-check.mjs" 2>/dev/null; then
            echo "::error::self-evolution: the base has no checker, so nothing older judges this branch"
            exit 1
          fi
          # the gate's files as the base lists them (scripts/gate-files.json, F-144);
          # a base from before the list has only its scripts/findings-*.mjs
          if git cat-file -e "origin/$base:scripts/gate-files.json" 2>/dev/null; then
            files=$(git show "origin/$base:scripts/gate-files.json" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).files.join("\n"))')
          else
            files=$(git ls-tree --name-only "origin/$base" scripts/ | grep -E '^scripts/findings-[a-z-]+\.mjs$')
          fi
          for f in $files; do
            mkdir -p "$RUNNER_TEMP/base-checker/$(dirname "$f")"
            git show "origin/$base:$f" > "$RUNNER_TEMP/base-checker/$f"
          done
          SAKK_BRANCH="$HEAD_REF" node "$RUNNER_TEMP/base-checker/scripts/findings-check.mjs" --range "origin/$base"
      # merge as you go (owner's rule, 2026-10-29): the three oldest open pull
      # requests pass, a fourth fails until one is merged or closed. The base's
      # copy of the cap judges, so a branch cannot raise its own limit.
      - name: at most three pull requests in flight (the base's cap judges)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          base="${BASE_REF:?the cap needs the pull request base}"
          git fetch -q origin "$base"
          cap="$RUNNER_TEMP/wip-limit.mjs"
          if git cat-file -e "origin/$base:scripts/wip-limit.mjs" 2>/dev/null; then
            git show "origin/$base:scripts/wip-limit.mjs" > "$cap"
          else
            echo "::notice::the base predates the open pull request cap; this branch's own scripts/wip-limit.mjs judges"
            cp scripts/wip-limit.mjs "$cap"
          fi
          node "$cap" --pr "${PR_NUMBER:?}"
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the DCO step reads every commit of the pull request
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm run format:check
      - run: npm run lint
      # every commit of a pull request, a fork's too, is signed off by its
      # author (DCO 1.1, CONTRIBUTING.md). A step in this job, not a job of
      # its own, so it adds no runner-minutes. The base's copy of the script
      # judges, so a branch cannot loosen it; the commits are read as data.
      - name: every commit is signed off by its author (DCO; the base's check judges)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="${BASE_REF:?the DCO check needs the pull request base}"
          git fetch -q origin "$base"
          dco="$RUNNER_TEMP/dco-check.mjs"
          if git cat-file -e "origin/$base:scripts/dco-check.mjs" 2>/dev/null; then
            git show "origin/$base:scripts/dco-check.mjs" > "$dco"
          else
            echo "::notice::the base predates the DCO check; this branch's own scripts/dco-check.mjs judges"
            cp scripts/dco-check.mjs "$dco"
          fi
          node "$dco" --range "origin/$base..${HEAD_SHA:?the DCO check needs the pull request head}"
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run drill
      - run: npm run fuzz
      - run: npm run fuzz:policy
      - run: npm run fuzz:l1
      - run: npm run campaigns
