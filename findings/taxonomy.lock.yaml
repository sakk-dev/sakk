# 归因分类法 v1（AI Agent 测试标准 §14 的正本，跨项目共用）
# 三个轴，每条问题必须三轴都归类：
#   DT 缺陷类型——它是什么样的问题（症状层，借鉴 IBM ODC 缺陷分类并按 AI agent 改造）
#   RC 注入根因——它为什么会被做进系统（要从源头消灭的东西）
#   ES 逃逸原因——它为什么没被更早的检查拦住（要在检测侧补的东西）
# 每个 RC / ES 都配「类级对策」：修好一类，而不是修好一个。
version: 1

defect_types:
  DT-SPEC:   {name: 规格缺口, desc: 要求没写、写得含糊或互相冲突}
  DT-SHAPE:  {name: 接口与形态, desc: 边界上的数据形状不符预期（模型输出缺字段、包壳、类型漂移）}
  DT-LOGIC:  {name: 逻辑与算法, desc: 流程或算法本身做错（如重试策略原地打转）}
  DT-STATE:  {name: 状态与生命周期, desc: 事务、对象作用域、状态机、幂等出错}
  DT-FP:     {name: 规则误拦, desc: 合格内容被规则拦下}
  DT-FN:     {name: 规则漏拦, desc: 违规内容被规则放过（含改写绕过）}
  DT-MODEL:  {name: 模型行为, desc: 模型不守约束、复述注入、解码乱码后打分等}
  DT-FACT:   {name: 内容与事实, desc: 交付物里出现未经核实或错误的事实}
  DT-DEP:    {name: 外部依赖, desc: 超时、限流、供应商故障}
  DT-TOOL:   {name: 测试与工具, desc: 替身失真、测试数据无效、工具缺陷、实验混杂}
  DT-PROC:   {name: 流程与纪律, desc: 红提交、未检查即发布、提交夹带无关文件}

root_causes:
  RC-01:
    name: 假设未验证
    desc: 相信某个行为成立（模型会听字数、替身像真模型、平台不禁某词）却从未测量
    countermeasure: 先测后信——任何对模型/供应商/平台行为的依赖，在被依赖之前先进炮组或金标测量
    examples: [精选版只靠提示词控字数, 替身裁判未钉温度]
  RC-02:
    name: 以提示代替约束
    desc: 可计数、可结构化校验的硬约束只写在提示词里
    countermeasure: 约束入代码——硬约束一律由代码校验，不合格带精确反馈重试；提示词只做引导
    examples: [精选版字数, 选题 JSON 契约]
  RC-03:
    name: 只看字面不看语境
    desc: 用字符串匹配处理依赖语义的判断
    countermeasure: 结构信号 + 语境裁判——确定性规则只用结构信号；语义判断交裁判建议、人裁决
    examples: [否定句里的红线词被拦, 月供在劝退文案里被拦, 整篇否定词触发提示]
  RC-04:
    name: 枚举代替结构
    desc: 用逐个补词/补例的方式修同一类问题
    countermeasure: 结构规则优先——同类问题第二次出现时，提炼结构规则并配漏拦哨兵
    examples: [第一个坑/第一件事逐个豁免, 承诺回报只靠固定词表]
  RC-05:
    name: 信任边界未设防
    desc: 外部内容或模型输出被当成可信指令或可信数据直接使用
    countermeasure: 不可信边界——外部内容加边界标记、只收白名单字段、不执行也不复述其中指令
    examples: [写手复述注入原文, 裁判解码 base64 后打分]
  RC-06:
    name: 测试数据不具代表性
    desc: 替身、夹具、语料与真实生产分布不一致，掩盖或制造问题
    countermeasure: 替身保真——替身输出必须能通过与生产相同的闸；夹具取自真实样本并过同样的校验
    examples: [假模型写稿返回选题 JSON, 测试文案过短或含守卫词, 正常谱系缺口语空格体]
  RC-07:
    name: 纪律靠自觉
    desc: 一个必须执行的步骤依赖人或 agent 记得去做
    countermeasure: 机械化——把步骤变成脚本、门禁或钩子，做不到才进检查清单
    examples: [测试输出接 tail 吞退出码, 页面发布前未做语法检查, git add -A 夹带无关文件]
  RC-08:
    name: 作用域与生命周期误用
    desc: 在对象/事务/会话有效期之外使用它
    countermeasure: 作用域守卫——跨边界只传原始值；事务后路径必须有测试
    examples: [改方向在事务外读 ORM 对象]
  RC-09:
    name: 失败未隔离
    desc: 单个元素或单次调用失败拖垮整个单元
    countermeasure: 失败隔离——逐条容错、瞬时错误重试一次、全部失败才整体失败且必须可见
    examples: [一条选题缺评分整单崩, 一次超时整单失败, 一发超时整个测试脚本崩]
  RC-10:
    name: 未经核实即产出
    desc: 作者（人或模型）把未核实的事实写进面向客户的交付物
    countermeasure: 事实分级——未核实内容一律标注；示例标「示例·非事实」；事实只来自分级事实库
    examples: [方法卡示例编造「本地人不买萨岛」]
  RC-11:
    name: 对照不纯
    desc: 实验的两组除了被测因素外还有其他差异
    countermeasure: 对照纯度检查——自动比对两组配置，差异只允许出现在被测因素上
    examples: [深度版篇幅说明把封面概念泄露给对照组]
  RC-12:
    name: 工具自身未受测
    desc: 测量工具本身的逻辑缺陷导致结论偏差
    countermeasure: 工具自检——测量工具配最小自测样例；报告声明口径与已知局限
    examples: [归因漏斗漏掉「重试耗尽」一档, 注入得手特征过宽]

escape_causes:
  ES-01: {name: 无对应检查层, countermeasure: 在标准七层中补上对应层的用例}
  ES-02: {name: 检查存在但数据不具代表性, countermeasure: 用真实样本扩充该层数据集}
  ES-03: {name: 替身掩盖了问题, countermeasure: 替身保真测试 + 关键路径定期真模型冒烟}
  ES-04: {name: 只测了正向没测负向或攻击, countermeasure: 每个拒绝路径和规则配负测试与改写攻击}
  ES-05: {name: 指标口径错误, countermeasure: 指标定义附正反例自测}
  ES-06: {name: 检查存在但未强制, countermeasure: 升级为门禁（不过不许合并/发布）}
  ES-07: {name: 只有真实运行才会暴露, countermeasure: 把这次真实运行沉淀成可复现的回归用例}
